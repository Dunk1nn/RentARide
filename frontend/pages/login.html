<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login – Rent A Ride</title>
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
<div class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">
      <div class="logo-text">🚗 Rent A Ride</div>
      <div class="logo-sub">Your journey starts here</div>
    </div>

    <h2 class="auth-title">Welcome back</h2>
    <p class="auth-sub">Sign in to your customer account</p>

    <form id="loginForm">
      <div class="form-group">
        <label class="form-label">Email Address</label>
        <input type="email" id="email" class="form-control" placeholder="you@example.com" required />
        <div class="form-error" id="email-error"></div>
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <input type="password" id="password" class="form-control" placeholder="••••••••" required />
        <div class="form-error" id="password-error"></div>
      </div>

      <button type="submit" class="btn btn-primary" style="width:100%; justify-content:center; padding:12px; margin-top:4px;" id="loginBtn">
        Sign In
      </button>
    </form>

    <div class="auth-footer">
      Don't have an account? <a href="register.html">Create one</a>
      <br><br>
      Are you an admin? <a href="admin-login.html">Admin Login →</a>
    </div>
  </div>
</div>

<script src="../js/api.js"></script>
<script src="../js/utils.js"></script>
<script>
  // Redirect if already logged in
  if (getToken() && getUser()?.role === 'user') {
    window.location.href = 'customer-dashboard.html';
  }

  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();

    const email    = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const btn      = document.getElementById('loginBtn');

    // Basic client-side validation
    let valid = true;
    if (!email) {
      showError('email-error', 'Email is required.');
      valid = false;
    } else clearError('email-error');

    if (!password) {
      showError('password-error', 'Password is required.');
      valid = false;
    } else clearError('password-error');

    if (!valid) return;

    btn.textContent = 'Signing in…';
    btn.disabled = true;

    try {
      const data = await authAPI.login({ email, password });
      saveAuth(data.token, data.user);
      showToast('Login successful! Redirecting…', 'success');
      setTimeout(() => window.location.href = 'customer-dashboard.html', 800);
    } catch (err) {
      showToast(err.message, 'error');
      btn.textContent = 'Sign In';
      btn.disabled = false;
    }
  });

  function showError(id, msg) {
    const el = document.getElementById(id);
    el.textContent = msg;
    el.classList.add('show');
  }
  function clearError(id) {
    const el = document.getElementById(id);
    el.classList.remove('show');
  }
</script>
</body>
</html>
