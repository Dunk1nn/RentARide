<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Profile – Rent A Ride</title>
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
<div class="app-layout">
  <div id="sidebar-container"></div>
  <div class="main-content">
    <header class="top-header">
      <div style="display:flex;align-items:center;gap:12px;">
        <button class="hamburger" onclick="toggleSidebar()">☰</button>
        <h1>My Profile</h1>
      </div>
      <div class="header-right">
        <div class="header-user">
          <div class="avatar" id="avatar-initials">U</div>
          <span id="user-name"></span>
        </div>
      </div>
    </header>
    <main class="page-body">
      <div style="max-width:560px;">
        <div class="card" style="margin-bottom:20px;">
          <div class="card-header"><span class="card-title">Account Info</span></div>
          <div class="card-body">
            <div style="display:flex;align-items:center;gap:16px;margin-bottom:24px;">
              <div style="width:64px;height:64px;border-radius:50%;background:var(--primary-light);color:var(--primary);font-size:1.6rem;font-weight:700;display:flex;align-items:center;justify-content:center;" id="big-avatar">U</div>
              <div>
                <div style="font-weight:700;font-size:1.1rem;" id="profile-name">—</div>
                <div style="color:var(--gray-500);font-size:.85rem;" id="profile-email">—</div>
                <div style="margin-top:4px;"><span class="badge badge-primary">⭐ <span id="profile-points">0</span> pts</span></div>
              </div>
            </div>
            <form id="profileForm">
              <div class="form-group">
                <label class="form-label">Full Name</label>
                <input type="text" id="name" class="form-control" />
              </div>
              <div class="form-group">
                <label class="form-label">Email</label>
                <input type="email" id="email" class="form-control" disabled style="background:var(--gray-50);" />
              </div>
              <div class="form-group">
                <label class="form-label">Phone</label>
                <input type="tel" id="phone" class="form-control" />
              </div>
              <button type="submit" class="btn btn-primary">Save Changes</button>
            </form>
          </div>
        </div>
        <div class="card">
          <div class="card-header"><span class="card-title">Change Password</span></div>
          <div class="card-body">
            <div class="form-group">
              <label class="form-label">New Password</label>
              <input type="password" id="new-pass" class="form-control" placeholder="Min. 6 characters" />
            </div>
            <div class="form-group">
              <label class="form-label">Confirm New Password</label>
              <input type="password" id="confirm-pass" class="form-control" />
            </div>
            <button class="btn btn-outline" onclick="changePassword()">Update Password</button>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>

<script src="../js/api.js"></script>
<script src="../js/utils.js"></script>
<script src="../js/sidebar.js"></script>
<script>
  if (!requireAuth('user')) {}
  document.addEventListener('DOMContentLoaded', async () => {
    renderCustomerSidebar();
    const user = getUser();
    if (user) {
      document.getElementById('avatar-initials').textContent = user.name.charAt(0).toUpperCase();
      document.getElementById('big-avatar').textContent      = user.name.charAt(0).toUpperCase();
      document.getElementById('profile-name').textContent    = user.name;
      document.getElementById('profile-email').textContent   = user.email;
      document.getElementById('profile-points').textContent  = user.loyalty_points || 0;
      document.getElementById('name').value  = user.name;
      document.getElementById('email').value = user.email;
    }
  });

  document.getElementById('profileForm').addEventListener('submit', (e) => {
    e.preventDefault();
    showToast('Profile updated! (Connect to /api/users/:id PUT to persist)', 'success');
  });

  function changePassword() {
    const np = document.getElementById('new-pass').value;
    const cp = document.getElementById('confirm-pass').value;
    if (np.length < 6) { showToast('Password must be at least 6 characters.', 'error'); return; }
    if (np !== cp) { showToast('Passwords do not match.', 'error'); return; }
    showToast('Password updated! (Connect to /api/users/change-password to persist)', 'success');
  }
</script>
</body>
</html>
