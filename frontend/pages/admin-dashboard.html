<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Dashboard – Rent A Ride</title>
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
<div class="app-layout">
  <div id="sidebar-container"></div>
  <div class="main-content">
    <header class="top-header">
      <div style="display:flex;align-items:center;gap:12px;">
        <button class="hamburger" onclick="toggleSidebar()">☰</button>
        <div>
          <h1>Admin Dashboard</h1>
          <div style="font-size:.78rem;color:var(--gray-500);">Rent A Ride Management</div>
        </div>
      </div>
      <div class="header-right">
        <button class="notification-btn">🔔</button>
        <div class="header-user">
          <div class="avatar" style="background:#FEF3C7;color:#D97706;" id="avatar-initials">A</div>
          <span id="user-name"></span>
        </div>
      </div>
    </header>

    <main class="page-body">
      <!-- Stats -->
      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-icon blue">👥</div>
          <div><div class="stat-label">Total Customers</div><div class="stat-value" id="stat-users">—</div></div>
        </div>
        <div class="stat-card">
          <div class="stat-icon orange">🚗</div>
          <div><div class="stat-label">Total Cars</div><div class="stat-value" id="stat-cars">—</div></div>
        </div>
        <div class="stat-card">
          <div class="stat-icon green">💰</div>
          <div><div class="stat-label">Total Revenue</div><div class="stat-value" id="stat-revenue">—</div></div>
        </div>
        <div class="stat-card">
          <div class="stat-icon purple">⏳</div>
          <div><div class="stat-label">Pending Bookings</div><div class="stat-value" id="stat-pending">—</div></div>
        </div>
        <div class="stat-card">
          <div class="stat-icon blue">🔑</div>
          <div><div class="stat-label">Active Rentals</div><div class="stat-value" id="stat-active">—</div></div>
        </div>
        <div class="stat-card">
          <div class="stat-icon green">✅</div>
          <div><div class="stat-label">Available Cars</div><div class="stat-value" id="stat-avail">—</div></div>
        </div>
      </div>

      <!-- Recent Rentals -->
      <div class="card">
        <div class="card-header">
          <span class="card-title">Recent Bookings</span>
          <a href="admin-rentals.html" class="btn btn-outline btn-sm">Manage All</a>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr><th>#</th><th>Customer</th><th>Vehicle</th><th>Amount</th><th>Status</th><th>Date</th><th>Action</th></tr>
            </thead>
            <tbody id="recent-tbody">
              <tr><td colspan="7"><div class="spinner"></div></td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>
</div>

<script src="../js/api.js"></script>
<script src="../js/utils.js"></script>
<script src="../js/sidebar.js"></script>
<script>
  if (!requireAuth('admin')) {}

  document.addEventListener('DOMContentLoaded', async () => {
    renderAdminSidebar();
    const user = getUser();
    if (user) document.getElementById('avatar-initials').textContent = user.name.charAt(0).toUpperCase();

    try {
      const data = await adminAPI.dashboard();
      const s = data.stats;
      document.getElementById('stat-users').textContent   = s.totalUsers;
      document.getElementById('stat-cars').textContent    = s.totalCars;
      document.getElementById('stat-revenue').textContent = formatCurrency(s.totalRevenue);
      document.getElementById('stat-pending').textContent = s.pendingBookings;
      document.getElementById('stat-active').textContent  = s.activeRentals;
      document.getElementById('stat-avail').textContent   = s.availableCars;

      const tbody = document.getElementById('recent-tbody');
      if (data.recentRentals.length === 0) {
        tbody.innerHTML = `<tr><td colspan="7"><div class="empty-state"><div class="empty-icon">📋</div><p>No bookings yet</p></div></td></tr>`;
      } else {
        tbody.innerHTML = data.recentRentals.map(r => `
          <tr>
            <td>#${r.id}</td>
            <td>${r.customer}</td>
            <td>${r.make} ${r.model}</td>
            <td>${formatCurrency(r.total_amount)}</td>
            <td>${statusBadge(r.status)}</td>
            <td>${formatDate(r.created_at)}</td>
            <td>
              ${r.status === 'pending' ? `
                <button class="btn btn-sm btn-primary" onclick="updateStatus(${r.id},'approved')">✓ Approve</button>
                <button class="btn btn-sm btn-danger" style="margin-left:4px;" onclick="updateStatus(${r.id},'rejected')">✕ Reject</button>
              ` : '—'}
            </td>
          </tr>
        `).join('');
      }
    } catch (err) {
      showToast('Failed to load dashboard.', 'error');
    }
  });

  async function updateStatus(id, status) {
    try {
      await rentalsAPI.updateStatus(id, status);
      showToast(`Rental ${status}!`, 'success');
      window.location.reload();
    } catch (err) {
      showToast(err.message, 'error');
    }
  }
</script>
</body>
</html>
