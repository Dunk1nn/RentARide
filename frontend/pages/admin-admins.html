<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Accounts – Rent A Ride</title>
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
<div class="app-layout">
  <div id="sidebar-container"></div>
  <div class="main-content">
    <header class="top-header">
      <div style="display:flex;align-items:center;gap:12px;">
        <button class="hamburger" onclick="toggleSidebar()">☰</button>
        <h1>Admin Accounts</h1>
      </div>
      <div class="header-right">
        <div class="header-user">
          <div class="avatar" style="background:#FEF3C7;color:#D97706;" id="avatar-initials">A</div>
          <span id="user-name"></span>
        </div>
      </div>
    </header>
    <main class="page-body">
      <div class="page-header">
        <h2>All Admins</h2>
        <button class="btn btn-primary" onclick="openModal()">+ Add Admin</button>
      </div>
      <div class="card">
        <div class="table-wrap">
          <table>
            <thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Joined</th></tr></thead>
            <tbody id="admins-tbody">
              <tr><td colspan="4"><div class="spinner"></div></td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>
</div>

<!-- Add Admin Modal -->
<div class="modal-overlay" id="adminModal">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title">Add Admin Account</span>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <form id="adminForm">
      <div class="form-group">
        <label class="form-label">Full Name</label>
        <input type="text" id="admin-name" class="form-control" required />
      </div>
      <div class="form-group">
        <label class="form-label">Email</label>
        <input type="email" id="admin-email" class="form-control" required />
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <input type="password" id="admin-password" class="form-control" placeholder="Min. 6 chars" required />
      </div>
      <div class="form-group">
        <label class="form-label">Role</label>
        <select id="admin-role" class="form-control">
          <option value="admin">Admin</option>
          <option value="superadmin">Super Admin</option>
        </select>
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;padding:12px;" id="saveBtn">
        Create Admin
      </button>
    </form>
  </div>
</div>

<script src="../js/api.js"></script>
<script src="../js/utils.js"></script>
<script src="../js/sidebar.js"></script>
<script>
  if (!requireAuth('admin')) {}

  document.addEventListener('DOMContentLoaded', async () => {
    renderAdminSidebar();
    const user = getUser();
    if (user) document.getElementById('avatar-initials').textContent = user.name.charAt(0).toUpperCase();
    await loadAdmins();
  });

  async function loadAdmins() {
    try {
      const data = await adminAPI.getAdmins();
      const tbody = document.getElementById('admins-tbody');
      tbody.innerHTML = data.data.map(a => `
        <tr>
          <td><strong>${a.name}</strong></td>
          <td>${a.email}</td>
          <td><span class="badge ${a.role==='superadmin'?'badge-warning':'badge-info'}">${a.role}</span></td>
          <td>${formatDate(a.created_at)}</td>
        </tr>`).join('');
    } catch (err) { showToast('Failed to load admins.', 'error'); }
  }

  function openModal()  { document.getElementById('adminModal').classList.add('open'); }
  function closeModal() { document.getElementById('adminModal').classList.remove('open'); document.getElementById('adminForm').reset(); }

  document.getElementById('adminForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('saveBtn');
    btn.textContent = 'Creating…'; btn.disabled = true;
    try {
      await adminAPI.createAdmin({
        name:     document.getElementById('admin-name').value,
        email:    document.getElementById('admin-email').value,
        password: document.getElementById('admin-password').value,
        role:     document.getElementById('admin-role').value,
      });
      showToast('Admin account created!', 'success');
      closeModal();
      await loadAdmins();
    } catch (err) {
      showToast(err.message, 'error');
    } finally {
      btn.textContent = 'Create Admin'; btn.disabled = false;
    }
  });

  document.getElementById('adminModal').addEventListener('click', e => { if (e.target===e.currentTarget) closeModal(); });
</script>
</body>
</html>
