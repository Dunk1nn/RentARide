<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login – Rent A Ride</title>
  <link rel="stylesheet" href="../css/style.css" />
</head>

<body>
  <div class="auth-page">
    <div class="auth-card">
      <div class="auth-logo">
        <div class="logo-text">🛡️ Admin Portal</div>
        <div class="logo-sub">Rent A Ride Management</div>
      </div>

      <h2 class="auth-title">Admin Sign In</h2>
      <p class="auth-sub">Access the management dashboard</p>



      <form id="adminLoginForm">
        <div class="form-group">
          <label class="form-label">Admin Email</label>
          <input type="email" id="email" class="form-control" placeholder="admin@rentaride.com" required />
        </div>
        <div class="form-group">
          <label class="form-label">Password</label>
          <input type="password" id="password" class="form-control" placeholder="••••••••" required />
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%; justify-content:center; padding:12px;"
          id="loginBtn">
          Sign In as Admin
        </button>
      </form>

      <div class="auth-footer">
        <a href="login.html">← Customer Login</a>
      </div>
    </div>
  </div>

  <script src="../js/api.js"></script>
  <script src="../js/utils.js"></script>
  <script>
    const u = getUser();
    if (getToken() && u && (u.role === 'admin' || u.role === 'superadmin')) {
      window.location.href = 'admin-dashboard.html';
    }

    document.getElementById('adminLoginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const btn = document.getElementById('loginBtn');

      btn.textContent = 'Signing in…';
      btn.disabled = true;

      try {
        const data = await authAPI.adminLogin({ email, password });
        saveAuth(data.token, data.user);
        showToast('Welcome, ' + data.user.name + '!', 'success');
        setTimeout(() => window.location.href = 'admin-dashboard.html', 800);
      } catch (err) {
        showToast(err.message, 'error');
        btn.textContent = 'Sign In as Admin';
        btn.disabled = false;
      }
    });
  </script>
</body>

</html>
