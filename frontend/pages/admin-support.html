<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Support Tickets – Admin</title>
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
<div class="app-layout">
  <div id="sidebar-container"></div>
  <div class="main-content">
    <header class="top-header">
      <div style="display:flex;align-items:center;gap:12px;">
        <button class="hamburger" onclick="toggleSidebar()">☰</button>
        <h1>Support Tickets</h1>
      </div>
      <div class="header-right">
        <div class="header-user">
          <div class="avatar" style="background:#FEF3C7;color:#D97706;" id="avatar-initials">A</div>
          <span id="user-name"></span>
        </div>
      </div>
    </header>
    <main class="page-body">
      <div class="card">
        <div class="table-wrap">
          <table>
            <thead>
              <tr><th>#</th><th>Customer</th><th>Subject</th><th>Status</th><th>Date</th><th>Action</th></tr>
            </thead>
            <tbody id="tickets-tbody">
              <tr><td colspan="6"><div class="spinner"></div></td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>
</div>

<!-- Reply Modal -->
<div class="modal-overlay" id="replyModal">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title">Reply to Ticket</span>
      <button class="modal-close" onclick="closeReply()">✕</button>
    </div>
    <div id="ticket-detail" style="background:var(--gray-50);border-radius:8px;padding:14px;margin-bottom:16px;font-size:.9rem;"></div>
    <div class="form-group">
      <label class="form-label">Your Reply</label>
      <textarea id="admin-reply" class="form-control" rows="4" placeholder="Type your response…"></textarea>
    </div>
    <button class="btn btn-primary" style="width:100%;justify-content:center;padding:12px;" id="replyBtn" onclick="submitReply()">
      Send Reply
    </button>
  </div>
</div>

<script src="../js/api.js"></script>
<script src="../js/utils.js"></script>
<script src="../js/sidebar.js"></script>
<script>
  if (!requireAuth('admin')) {}
  let selectedTicketId = null;

  document.addEventListener('DOMContentLoaded', async () => {
    renderAdminSidebar();
    const user = getUser();
    if (user) document.getElementById('avatar-initials').textContent = user.name.charAt(0).toUpperCase();
    await loadTickets();
  });

  async function loadTickets() {
    try {
      const data = await adminAPI.getTickets();
      const tbody = document.getElementById('tickets-tbody');
      if (data.data.length === 0) {
        tbody.innerHTML = `<tr><td colspan="6"><div class="empty-state"><div class="empty-icon">💬</div><p>No support tickets</p></div></td></tr>`;
        return;
      }
      tbody.innerHTML = data.data.map(t => `
        <tr>
          <td>#${t.id}</td>
          <td>${t.customer_name}</td>
          <td>${t.subject}</td>
          <td>${statusBadge(t.status)}</td>
          <td>${formatDate(t.created_at)}</td>
          <td><button class="btn btn-sm btn-outline" onclick='openReply(${JSON.stringify(t)})'>Reply</button></td>
        </tr>`).join('');
    } catch (err) { showToast('Failed to load tickets.', 'error'); }
  }

  function openReply(ticket) {
    selectedTicketId = ticket.id;
    document.getElementById('ticket-detail').innerHTML = `
      <strong>${ticket.customer_name}</strong> — ${ticket.subject}<br>
      <span style="color:var(--gray-600);margin-top:6px;display:block;">${ticket.message}</span>
      ${ticket.admin_reply ? `<hr style="margin:10px 0;border:none;border-top:1px solid var(--gray-200);"><strong>Previous reply:</strong> ${ticket.admin_reply}` : ''}`;
    document.getElementById('admin-reply').value = '';
    document.getElementById('replyModal').classList.add('open');
  }

  function closeReply() { document.getElementById('replyModal').classList.remove('open'); }

  async function submitReply() {
    const btn = document.getElementById('replyBtn');
    btn.textContent = 'Sending…'; btn.disabled = true;
    try {
      await adminAPI.replyTicket(selectedTicketId, { admin_reply: document.getElementById('admin-reply').value, status: 'resolved' });
      showToast('Reply sent!', 'success');
      closeReply();
      await loadTickets();
    } catch (err) { showToast(err.message, 'error'); }
    finally { btn.textContent = 'Send Reply'; btn.disabled = false; }
  }

  document.getElementById('replyModal').addEventListener('click', e => { if(e.target===e.currentTarget) closeReply(); });
</script>
</body>
</html>
